
name: Java AWS CI CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-challenge-deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Compile and test
        working-directory: ./app
        run: mvn --batch-mode clean verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:1.0
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ vars.AWS_REGION }}"

      
      - name: Verify public endpoint
        run: |
          URL="http://aws-challenge-alb-393189667.us-east-2.elb.amazonaws.com/actuator/health"

          for i in {1..30}; do
            echo "Checking application health: attempt $i"

            if curl -fsS --connect-timeout 5 --max-time 10 "$URL"; then
              echo ""
              echo "Application is healthy!"
              exit 0
            fi

            sleep 10
          done

          echo "Application did not become healthy."
          exit 1


      - name: Verify public endpoint
        run: |
          curl --fail --show-error \
            --retry 5 \
            --retry-delay 10 \
            "http://aws-challenge-alb-393189667.us-east-2.elb.amazonaws.com/actuator/health"
